<div class="rounded-md border shadow border-dark-gray/50 flex flex-col gap-3 p-4">
  <div class="flex items-center justify-between gap-4">
    <span class="font-semibold text-md capitalize">{{ incident().title }}</span>
    <i [class]="cn(`${incident().icon} text-2xl`, {
    'text-neutral-600': incident().description === 'total',
    'text-yellow-500': incident().description === 'pending',
    'text-blue-600': incident().description === 'in-progress',
    'text-green-600': incident().description === 'resolved',
    })"></i>
  </div>
  <span class="font-bold text-2xl flex items-center">
    <span [class]="cn('text-black   ', {
    'text-neutral-600': incident().description === 'total',
        'text-yellow-500': incident().description === 'pending',
    'text-blue-600': incident().description === 'in-progress',
    'text-green-600': incident().description === 'resolved',
    })">{{ incident().number }}</span>

  </span>
</div>
